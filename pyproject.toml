[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-churn-analytics"
version = "1.0.0"
description = "Customer churn prediction and retention analytics"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "sqlalchemy",
    "streamlit",
    "plotly",
    "joblib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "jupyterlab",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["src*", "dashboard*"]
